site_name: Boyles.PowerShell
site_description: PowerShell modules for MSP automation
repo_url: https://github.com/wayneboyles/Boyles.PowerShell
docs_dir: docs

theme:
  name: material
  logo: assets/Logo-85x85.png
  features:
    - navigation.indexes # module README.md becomes the section landing page
    - navigation.sections
    - navigation.tabs
    - navigation.path
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

