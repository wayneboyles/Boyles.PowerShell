name: 'Build Release on Tag'

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
      inputs:
        test_tag:
          description: 'v0.2.1'
          required: true

permissions: 
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Tag is on Main
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.test_tag }}' } else { $env:GITHUB_REF_NAME }
          git fetch origin main
          if (-not (git merge-base --is-ancestor $env:GITHUB_SHA origin/main)) {
            Write-Error "Tag $tag does not point to a commit on main."
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('**/requirements.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-

      - name: Bootstrap dependencies
        shell: pwsh
        run: .\build.ps1 -Bootstrap

      - name: Build and package
        shell: pwsh
        run: .\build.ps1 -Task Package

      - name: Extract changelog section
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw

          if ($content -match "(?ms)^## \[$([regex]::Escape($version))\].*?\r?\n(.*?)(?=^## \[)") {
            $notes = $matches[1].Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) {
              Write-Error "Changelog section for $version is empty."
              exit 1
            }
            $notes | Out-File -FilePath release-notes.md -Encoding utf8
          } else {
            Write-Error "Could not find a CHANGELOG.md section for [$version]."
            exit 1
          }

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: out/Packages/*.nupkg
          body_path: release-notes.md